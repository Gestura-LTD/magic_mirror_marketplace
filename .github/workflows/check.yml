# The Marketplace's automatic checks (MagicMirror_MusicLearningCompanion).
#
# On every pull request: each added or changed packages/<id>/<version>.json is checked -- the zip is downloaded,
# its sha256 compared, unpacked safely (no links, nothing outside, <= 400 files, <= 40 MB) and run through
# tools/check.py (the same rules as the mirror); the zip's manifest.json must equal the entry's. The signed
# index.json (if present) is verified against keys/*.pub.
# On every push to main: the same for every entry, plus the index.
#
# It runs as `pull_request` (never `pull_request_target`): read-only token, no secrets, so a submitted zip can never
# reach the signing key. Signing is a maintainer step (README, "signing a new list").
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one dependency (signatures)
        run: python -m pip install --disable-pip-version-check "cryptography>=42"

      - name: A pull request from a fork changes packages/ only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          bad=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^packages/' || true)
          if [ -n "$bad" ]; then
            echo "::error::A submission may only add files under packages/. Also changed:"; echo "$bad"; exit 1
          fi

      - name: A version file is never edited once merged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}...HEAD" -- 'packages/*/*.json' || true)
          if [ -n "$changed" ]; then
            echo "::error::Add a new version file instead of changing or deleting one:"; echo "$changed"; exit 1
          fi

      - name: Check the submitted games
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AR "origin/${{ github.base_ref }}...HEAD" -- 'packages/*/*.json' || true)
          python tools/market_tool.py ci $files

      - name: Check every game and the signed index
        if: github.event_name != 'pull_request'
        run: python tools/market_tool.py ci
